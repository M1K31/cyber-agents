[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-agents"
version = "0.1.0"
description = "Cyber Agents — cybersecurity agent harness with the AegisSIEM daemon; installs agents, skills, commands, hooks and MCP servers into ecosystem projects"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.14",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "aiohttp>=3.9",

    # appEcosystem integration. NOT optional: the harness is an ecosystem
    # component (it is the preferred security-analysis backend registered in
    # ecosystem.yaml), so these belong in the ordinary dependency list.
    # Published to PyPI; previously installed from a sibling checkout by
    # scripts/install-local.sh, which failed with only a warning when absent.
    "appecosystem-client>=0.4.0",   # first release with contracts + ulid
    "appecosystem-auth>=0.4.0",
    "appecosystem-ai>=0.1.1,<0.2",
    # Policy engine and hub runtime. Published 2026-11-11; before that they were
    # only importable from a sibling appEcosystem checkout, which is why a
    # clean install could not start.
    "appecosystem-policy>=0.3.0",
    "appecosystem-hub>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
]

[project.scripts]
aegissiem-daemon = "daemon.aegissiem_daemon:main"
cyber-harness = "installer.cli:main"

[tool.setuptools]
# Include non-Python files in the sdist/wheel
include-package-data = true

[tool.setuptools.packages.find]
include = ["daemon*", "installer*"]
